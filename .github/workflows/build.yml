name: Build plugin (macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:      # adds a "Run workflow" button in the Actions tab

jobs:
  build-macos:
    name: build (${{ matrix.os }})
    # GitHub's Apple-silicon runners are often unavailable for 15+ minutes and then the job is cancelled, which turned every
    # run red. So a normal push builds on the Intel runner only; the "Run workflow" button also adds the Apple-silicon job.
    strategy:
      fail-fast: false      # one runner type being busy must not hide the other's result
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"os":"macos-26","artifact":"Dub-Stab-Plaits-macOS"},{"os":"macos-15-intel","artifact":"Dub-Stab-Plaits-macOS-built-on-intel-runner"}]' || '[{"os":"macos-15-intel","artifact":"Dub-Stab-Plaits-macOS-built-on-intel-runner"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN_AFTER_BUILD=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reference script is the unmodified original
        run: |
          cd tests/reference
          shasum -a 256 -c dubstab.js.sha256

      - name: Headless tests (sequencer vs the original JavaScript, transport, sound models, effects, direct play)
        shell: bash {0}
        run: |
          # Any failing line is also repeated as an annotation, so it can be read without opening the full log.
          rc=0
          step() { "$@" > step.log 2>&1; local r=$?; cat step.log;
                   if [ $r -ne 0 ]; then rc=$r; grep -n -i -E "FAIL|error|Assertion|Abort" step.log | head -15 | while IFS= read -r l; do echo "::error::$*: $l"; done; fi; }
          step cmake --build build --target seq_crosscheck transport_test synth_test fx_test direct_test render_demos -j4
          node --version
          [ $rc -eq 0 ] && { node tests/reference/ref_dump.js tests/scenarios.txt > expected.txt || rc=$?; }
          [ $rc -eq 0 ] && { ./build/seq_crosscheck tests/scenarios.txt > actual.txt || rc=$?; }
          if [ $rc -eq 0 ]; then
            echo "scenarios: $(grep -c '^## ' expected.txt), log lines: $(wc -l < expected.txt | tr -d ' ')"
            if cmp -s expected.txt actual.txt; then echo "sequencer cross-check: the C++ port and the original JavaScript give identical logs"
              echo "::notice::sequencer cross-check IDENTICAL: $(grep -c '^## ' expected.txt) scenarios, $(wc -l < expected.txt | tr -d ' ') log lines (node $(node --version), runner $(uname -m))"
            else
              rc=1
              n=$(cmp expected.txt actual.txt 2>&1 | sed -E 's/.*line ([0-9]+).*/\1/')
              echo "::error::sequencer cross-check: first difference at line $n"
              echo "--- original (JavaScript) vs port (C++), around line $n"
              diff <(sed -n "$((n>3?n-3:1)),$((n+3))p" expected.txt) <(sed -n "$((n>3?n-3:1)),$((n+3))p" actual.txt) | head -20
              echo "--- scenario:"; awk -v n="$n" 'NR<=n && /^## /{s=$0} NR==n{print s}' expected.txt
            fi
          fi
          [ $rc -eq 0 ] && step ./build/transport_test && echo "::notice::$(tail -1 step.log) (runner $(uname -m))"
          # Sound models: finite / bounded / not silent on all 8 models at 3 sample rates, block-size invariance, model
          # switching, hostile input, the whole sequencer -> clock -> synth chain, pitch. (About 1-2 minutes.)
          [ $rc -eq 0 ] && step ./build/synth_test && echo "::notice::$(tail -1 step.log) (runner $(uname -m))"
          # Echo / reverb / width, and the MIDI-notes-play-directly logic and the pattern -> MIDI export.
          [ $rc -eq 0 ] && step ./build/fx_test && echo "::notice::$(tail -1 step.log) (runner $(uname -m))"
          [ $rc -eq 0 ] && step ./build/direct_test && echo "::notice::$(tail -1 step.log) (runner $(uname -m))"
          exit $rc

      - name: Build AU + VST3
        run: cmake --build build --target DubStabPlaits_AU DubStabPlaits_VST3 -j4

      - name: Ad-hoc sign (lets Apple silicon load an unsigned build)
        run: |
          for b in build/DubStabPlaits_artefacts/Release/AU/*.component build/DubStabPlaits_artefacts/Release/VST3/*.vst3; do
            codesign --force --deep -s - "$b"
          done

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/DubStabPlaits_artefacts/Release/AU/*.component dist/
          cp -R build/DubStabPlaits_artefacts/Release/VST3/*.vst3 dist/
          mkdir -p dist/licenses
          cp LICENSE dist/licenses/LICENSE-particledots.txt
          cp licenses/CREDITS.md licenses/NARTI-LIVE-LICENSE.txt dist/licenses/
          lipo -archs dist/*.component/Contents/MacOS/*
          echo "::notice::AU binary architectures: $(lipo -archs dist/*.component/Contents/MacOS/*); VST3: $(lipo -archs dist/*.vst3/Contents/MacOS/*)"
          codesign --verify --deep dist/*.component && echo "::notice::AU ad-hoc signature verifies"
          # Show the minimum macOS version baked into each slice (should say 11.0):
          for a in arm64 x86_64; do echo "== $a"; lipo -thin $a dist/*.component/Contents/MacOS/* -output /tmp/slice_$a; otool -l /tmp/slice_$a | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | grep -E "minos|version"; echo "::notice::$a slice minimum macOS: $(otool -l /tmp/slice_$a | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN' | grep -E 'minos|version' | head -1 | tr -s ' ')"; done
          cat > dist/INSTALL.txt <<'TXT'
          1. Unzip.
          2. Open Terminal and run:   xattr -dr com.apple.quarantine ~/Downloads/Dub-Stab-Plaits-macOS/*
             (adjust the path if you unzipped elsewhere; this clears the "downloaded from internet" block)
          3. Copy "Unofficial Dub Stab Plaits.component" to  ~/Library/Audio/Plug-Ins/Components/
             Copy "Unofficial Dub Stab Plaits.vst3"       to  ~/Library/Audio/Plug-Ins/VST3/
          4. In Logic: Settings > Plug-in Manager > rescan.
          5. It is a plain instrument (no audio input): make a Software Instrument track, click its
             Instrument slot, and choose Audio Units > particledots > Unofficial Dub Stab Plaits.
             It plays when Logic plays (or tick FREE-RUN WHEN STOPPED). To drive it from a MIDI effect, set
             MIDI NOTES DO THIS to "Play the notes directly".
          6. Credits and licences: see the "licenses" folder. Not affiliated with Narti Live or Mutable Instruments.
          TXT
          # Easy installer for Logic (double-click; same file in every Unofficial plugin)
          cp tools/install/Install-Unofficial-Plugin.command dist/
          chmod +x dist/Install-Unofficial-Plugin.command
          if [ -f dist/INSTALL.txt ]; then printf '\nEASY INSTALL (Logic, Audio Unit): double-click Install-Unofficial-Plugin.command in this folder. It asks for your Mac password once.\n' >> dist/INSTALL.txt; fi
          [ -x dist/Install-Unofficial-Plugin.command ] || { echo "::error::PACKAGE missing Install-Unofficial-Plugin.command"; exit 1; }
          ditto -c -k --keepParent dist Dub-Stab-Plaits-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: Dub-Stab-Plaits-macOS.zip

      # Listening aid: one WAV per sound model, played by the real sequencer (dry, 124 BPM, 8 bars).
      - name: Render model demos
        run: |
          mkdir -p demos
          ./build/render_demos demos 48000 1 | tee demos/render.log
          echo "::notice::demo files: $(ls demos/*.wav | wc -l) wavs; $(tr '\n' ';' < demos/render.log)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-model-demos
          path: demos/*.wav

      # After the upload on purpose: a problem here shows up red but can never stop the plug-in artifact from being produced.
      - name: Processor test (the real plug-in code, no host)
        timeout-minutes: 20
        shell: bash {0}
        run: |
          # Compiler errors, crashes and FAIL lines are all repeated as annotations, so they can be read without opening the log.
          cmake --build build --target plugin_test -j4 > plugin_build.log 2>&1; rc=$?
          if [ $rc -ne 0 ]; then
            tail -40 plugin_build.log
            grep -n -E "error|undefined|ld:" plugin_build.log | head -15 | while IFS= read -r l; do echo "::error::plugin_test build: $l"; done
            exit $rc
          fi
          ./build/plugin_test > plugin_test.log 2>&1; rc=$?; cat plugin_test.log
          [ $rc -eq 0 ] && echo "::notice::$(tail -1 plugin_test.log) (runner $(uname -m))"
          if [ $rc -ne 0 ]; then
            grep -n -E "FAIL|Assertion|JUCE Assertion" plugin_test.log | head -15 | while IFS= read -r l; do echo "::error::plugin_test: $l"; done
            echo "::error::plugin_test exited with code $rc; last lines: $(tail -5 plugin_test.log | tr '\n' ' ')"
          fi
          exit $rc
